<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Example Quiz - TriviaThrone</title>
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    </head>
    <body>
        <main>
            <h1 id="game-title">Example quiz</h1>
            <p id="game-status" role="status" aria-live="polite">Connecting to game…</p>
            <section aria-labelledby="question-heading">
                <h2 id="question-heading">Question</h2>
                <p id="question-text"></p>
                <button id="reveal-answer" type="button" disabled>Reveal answer</button>
                <p id="answer-text" hidden></p>
            </section>
            <section aria-label="Host controls">
                <button id="start-game" type="button">Start game</button>
                <button id="end-game" type="button" disabled>End game</button>
            </section>
        </main>
        <script type="module" src="/mods/example-quiz/ui/js/game.js"></script>
    </body>
</html>
