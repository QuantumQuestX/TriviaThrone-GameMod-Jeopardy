<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Example Quiz Creator - TriviaThrone</title>
    </head>
    <body>
        <main>
            <h1>Create an example quiz</h1>
            <p>Create a game package, then import it into a lobby.</p>
            <form id="quiz-form">
                <p>
                    <label for="title">Game title</label>
                    <input id="title" name="title" type="text" value="Example quiz" required />
                </p>
                <p>
                    <label for="question">Question</label>
                    <input
                        id="question"
                        name="question"
                        type="text"
                        value="What is the answer to life, the universe, and everything?"
                        required
                    />
                </p>
                <p>
                    <label for="answer">Answer</label>
                    <input id="answer" name="answer" type="text" value="42" required />
                </p>
                <button type="submit">Download game package</button>
            </form>
            <p id="creator-status" role="status" aria-live="polite"></p>
        </main>
        <script type="module" src="/mods/example-quiz/ui/js/editor.js"></script>
    </body>
</html>
